<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SSIS staff · ExplAIn Sims · Mac apps</title>
<style>:root{--bg:#fbfbfd;--bg2:#f1f1f5;--card:#fff;--edge:0 0 0 .5px rgba(0,0,0,.07),0 6px 22px rgba(30,30,60,.06);--text:#1d1d1f;--text2:#6e6e73;--text3:#a3a3a8;--sep:rgba(0,0,0,.085);--fill:rgba(0,0,0,.075);--accent:#0a7aff;--ink:#0a6be0;--warm:#e98400;
--hero:radial-gradient(70% 120% at 15% 0%,#dfe9ff 0%,rgba(223,233,255,0) 60%),radial-gradient(60% 120% at 90% 10%,#ffe6dc 0%,rgba(255,230,220,0) 60%)}
@media (prefers-color-scheme:dark){:root{--bg:#141417;--bg2:#1b1b1f;--card:#1f1f24;--edge:0 0 0 .5px rgba(255,255,255,.08),0 6px 22px rgba(0,0,0,.3);--text:#f4f4f7;--text2:#a2a2aa;--text3:#6c6c74;--sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.12);--accent:#2f8cff;--ink:#6aaeff;--warm:#ff9f2e;
--hero:radial-gradient(70% 120% at 15% 0%,#1b2a55 0%,rgba(27,42,85,0) 60%),radial-gradient(60% 120% at 90% 10%,#48262a 0%,rgba(72,38,42,0) 60%)}}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0 auto;max-width:1180px;padding:0 16px 40px;font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}a:hover{text-decoration:underline}
.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:16px;flex-wrap:wrap}.nav nav{display:flex;gap:20px}.nav nav a{color:var(--text2)}.nav nav a.here{color:var(--text);font-weight:600}
.hero{border-radius:22px;background:var(--hero),var(--bg2);padding:44px 48px;display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:clamp(32px,5vw,46px);line-height:1.05;letter-spacing:-.035em;margin:0;font-weight:800}.hero p{color:var(--text2);margin:12px 0 0;max-width:520px;font-size:17px}
.get{margin-left:auto;max-width:380px;border-radius:18px;background:var(--card);box-shadow:var(--edge);padding:20px;display:flex;gap:16px}.get b{font-size:18px}.get p{margin:4px 0 12px;color:var(--text2);font-size:14px}.get small{display:block;margin-top:8px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:15px;background:var(--fill);color:var(--ink);font:600 14px/1 inherit;border:0;cursor:pointer;font-family:inherit}.btn.primary{background:var(--accent);color:#fff}.btn:hover{text-decoration:none;filter:brightness(1.05)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:32px 8px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.grid.two{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:16px}
.card{border-radius:16px;background:var(--card);box-shadow:var(--edge);padding:16px;display:flex;gap:14px;align-items:flex-start}.card .icon{flex:none;border-radius:12px}
.card h3{margin:0;font-size:16px}.card p{margin:3px 0 10px;color:var(--text2);font-size:14px}.card p.tag{min-height:2.9em}
.grid:not(.two) .card{display:grid;grid-row:span 4;grid-template-rows:subgrid;grid-template-columns:56px minmax(0,1fr);column-gap:14px;row-gap:0;align-items:start}
.grid:not(.two) .card .body{display:contents}.grid:not(.two) .card .icon{grid-column:1;grid-row:1 / span 4}.grid:not(.two) .card .body>*{grid-column:2}.card .body{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row small{color:var(--text3);font-size:12px}.links{font-size:12px;color:var(--text3)}
details{margin-top:10px;font-size:14px}summary{cursor:pointer;color:var(--ink);font-size:13px}details ul{margin:4px 0 8px;padding-left:20px;color:var(--text2)}
.shots{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.shots img{height:150px;border-radius:8px;box-shadow:0 0 0 .5px var(--sep)}
.alt{color:var(--text2);font-size:13px}.pad{padding:12px 8px}.needs{color:var(--warm)!important;font-size:13px!important;font-weight:500}
footer{margin-top:36px;padding:16px 8px 0;border-top:1px solid var(--sep);color:var(--text2);font-size:13px}.empty{color:var(--text2);padding:20px 8px}
.signin{margin:40px auto;max-width:440px;text-align:center;border-radius:20px;background:var(--card);box-shadow:var(--edge);padding:28px 30px}.signin h2{margin:4px 0}.signin p{color:var(--text2)}
.badge{font-size:30px}.problem{color:var(--warm)!important}
.who{display:flex;justify-content:space-between;align-items:center;margin:4px 0 0;padding:12px 16px;border-radius:14px;background:var(--bg2);color:var(--text2)}.who b{color:var(--text)}
@media (max-width:640px){.hero{padding:28px 22px}.get{margin-left:0}.nav{padding:14px 4px}}</style>
</head>
<body>
<header class="nav"><b>ExplAIn Sims · Mac apps</b><nav><a href="../">Apps</a><a class="here" href="./">SSIS staff</a></nav></header>
<main>
  <div id="signedout" class="signin">
    <div class="badge">🎓</div>
    <h2>For SSIS staff</h2>
    <p>Apps that only work at SSIS. Sign in with your @ssis.edu.vn Google account to see and download them.</p>
    <button id="signin" class="btn primary">Sign In with SSIS</button>
    <p id="problem" class="problem" hidden></p>
  </div>
  <div id="signedin" hidden>
    <div class="who"><span>Signed in as <b id="email"></b></span><button id="signout" class="btn">Sign Out</button></div>
    <div id="apps" class="grid two"></div>
    <p class="alt pad">Easier: get Storefront from the main page and sign in there, and these keep themselves up to date.</p>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getStorage, ref, getBlob } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
const domain = "ssis.edu.vn", prefix = "store/ssis";
const app = initializeApp({ apiKey: "AIzaSyD40lxPH6seRBUXOtSoF3SEVNTMq3LsZjw", authDomain: "ssis-apps.firebaseapp.com", projectId: "ssis-apps", storageBucket: "ssis-apps-store" });
const auth = getAuth(app), storage = getStorage(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ hd: domain, prompt: "select_account" });
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pathOf = (url) => decodeURIComponent(new URL(url).pathname.split("/o/")[1] || "");
const blobURL = async (url) => URL.createObjectURL(await getBlob(ref(storage, pathOf(url))));
const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
function problem(text) { $("problem").textContent = text; $("problem").hidden = !text; }
$("signin").onclick = () => signInWithPopup(auth, provider).catch((e) => problem("Sign-in didn't finish: " + e.message));
$("signout").onclick = () => signOut(auth);
onAuthStateChanged(auth, async (user) => {
  if (user && !(user.email || "").toLowerCase().endsWith("@" + domain)) {
    await signOut(auth); problem("Only @" + domain + " accounts can see these apps."); return;
  }
  $("signedout").hidden = !!user; $("signedin").hidden = !user;
  if (!user) return;
  problem(""); $("email").textContent = user.email;
  try {
    const catalog = JSON.parse(await (await getBlob(ref(storage, prefix + "/catalog.json"))).text());
    const list = $("apps"); list.innerHTML = "";
    for (const a of catalog.apps) {
      const zip = a.release.zip || a.release.update;
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `<img class="icon" alt="" width="52" height="52"><div class="body"><h3>${esc(a.name)}</h3><p class="tag">${esc(a.tagline)}</p>` +
        (a.needs ? `<p class="needs">🔑 ${esc(a.needs)}</p>` : "") +
        `<div class="row"><button class="btn">Download</button><small>${esc(a.release.version)} · ${size(zip.length)}</small></div></div>`;
      list.append(card);
      if (a.icon) blobURL(a.icon).then((u) => card.querySelector("img").src = u).catch(() => {});
      card.querySelector("button").onclick = async (e) => {
        e.target.textContent = "Downloading…";
        try {
          const link = document.createElement("a");
          link.href = await blobURL(zip.url); link.download = pathOf(zip.url).split("/").pop(); link.click();
          e.target.textContent = "Download";
        } catch (err) { e.target.textContent = "Download"; problem("The download didn't work: " + err.message); }
      };
    }
    if (!catalog.apps.length) list.innerHTML = '<p class="alt">No SSIS apps are published yet.</p>';
  } catch (err) { problem("The SSIS apps couldn't be loaded: " + err.message); }
});
</script>
</body>
</html>
